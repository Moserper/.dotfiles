# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
# Tab completion for Antigravity CLI (agy).
# After editing: `exec zsh` — carapace binds compdef at init and never reloads.
# ALWAYS validate an edit with:  carapace agy zsh agy ''
name: agy
description: Google Antigravity — agentic coding assistant CLI
flags:
  -c, --continue: continue the most recent conversation
  -p, --print=: run a single prompt non-interactively and print the response
  --prompt=: alias for --print
  -i, --prompt-interactive=: run an initial prompt interactively and continue the session
  --agent=: agent for the current CLI session
  --conversation=: resume a previous conversation by ID
  --model=: model for the current CLI session
  --effort=: reasoning effort for the current CLI session (low|medium|high)
  --mode=: agent execution mode for this session (accept-edits|plan)
  --add-dir*=: add a directory to the workspace (repeatable)
  --output-format=: output format for print mode (text|json|stream-json)
  --input-format=: input format for print mode (text|stream-json)
  --json-schema=: optional JSON schema string or path to a schema file
  --project=: project ID or project name for the current CLI session
  --new-project: create a new project for this session
  --dangerously-skip-permissions: auto-approve all tool permission requests without prompting
  --disable-slash-commands: disable slash command and skill expansion in print mode
  --sandbox: run in a sandbox with terminal restrictions enabled
  --log-file=: override CLI log file path
  --print-timeout=: timeout for print mode wait (default 5m0s)
  -v=: log verbosity level
  --version: print version
  -h, --help: show help
completion:
  flag:
    model:
      - "gemini-3.8-flash-high\tGemini 3.8 Flash (High)"
      - "gemini-3.8-flash-medium\tGemini 3.8 Flash (Medium)"
      - "gemini-3.8-flash-low\tGemini 3.8 Flash (Low)"
      - "gemini-3.7-flash-high\tGemini 3.7 Flash (High)"
      - "gemini-3.7-flash-medium\tGemini 3.7 Flash (Medium)"
      - "gemini-3.7-flash-low\tGemini 3.7 Flash (Low)"
      - "gemini-3.6-flash-high\tGemini 3.6 Flash (High)"
      - "gemini-3.6-flash-medium\tGemini 3.6 Flash (Medium)"
      - "gemini-3.6-flash-low\tGemini 3.6 Flash (Low)"
      - "gemini-3.1-pro-high\tGemini 3.1 Pro (High)"
      - "gemini-3.1-pro-low\tGemini 3.1 Pro (Low)"
      - "claude-sonnet-4-6\tClaude Sonnet 4.6 (Thinking)"
      - "claude-opus-4-6-thinking\tClaude Opus 4.6 (Thinking)"
      - "gpt-oss-120b-medium\tGPT-OSS 120B (Medium)"
    effort: ["low", "medium", "high"]
    mode:
      - "accept-edits\tauto-accept file edits"
      - "plan\tread-only planning mode"
    output-format: ["text", "json", "stream-json"]
    input-format: ["text", "stream-json"]
    add-dir: ["$directories"]
    log-file: ["$files"]
    json-schema: ["$files"]
    conversation: ["$(ls -t ~/.gemini/antigravity-cli/brain 2>/dev/null)"]
commands:
  - name: agent
    aliases: [agents]
    description: list available agents
    flags:
      -h, --help: show help
  - name: changelog
    description: show changelog and release notes
    flags:
      -h, --help: show help
  - name: help
    description: show help for subcommands
    completion:
      positional:
        - ["agent", "agents", "changelog", "install", "mcp", "mic-serve", "models", "plugin", "plugins", "remote-control", "update"]
  - name: install
    description: configure environment paths and shell settings
    flags:
      --dir=: custom directory target to configure PATH for
      --skip-aliases: bypasses shell profile alias purging
      --skip-path: bypasses shell profile PATH appending
      -h, --help: show help
    completion:
      flag:
        dir: ["$directories"]
  - name: mcp
    description: manage MCP servers
    flags:
      -h, --help: show help
    commands:
      - name: add
        description: add or update an MCP server configuration
        flags:
          -H, --header*=: "HTTP header Key: Value (repeatable)"
          -e, --env*=: "environment variable KEY=value (repeatable)"
          -t, --type=: "server type ('stdio' or 'http')"
          -h, --help: show help
        completion:
          flag:
            type: ["stdio", "http"]
      - name: remove
        description: remove an MCP server configuration
        flags:
          -h, --help: show help
        completion:
          positional:
            - ["$(ls ~/.gemini/antigravity-cli/mcp 2>/dev/null)"]
      - name: list
        description: list all configured MCP servers
        flags:
          -h, --help: show help
      - name: enable
        description: enable an MCP server
        flags:
          -h, --help: show help
        completion:
          positional:
            - ["$(ls ~/.gemini/antigravity-cli/mcp 2>/dev/null)"]
      - name: disable
        description: disable an MCP server
        flags:
          -h, --help: show help
        completion:
          positional:
            - ["$(ls ~/.gemini/antigravity-cli/mcp 2>/dev/null)"]
  - name: mic-serve
    description: serve this machine's microphone to a CLI on another host
    flags:
      --addr=: address to listen on (default 127.0.0.1:4713)
      -h, --help: show help
  - name: models
    description: list available models
    flags:
      -h, --help: show help
  - name: plugin
    aliases: [plugins]
    description: manage plugins (install, uninstall, list, enable, disable)
    commands:
      - name: list
        description: list imported plugins
      - name: import
        description: import plugins from gemini or claude
        completion:
          positional:
            - ["gemini", "claude"]
      - name: install
        description: install a plugin (supports plugin@marketplace)
      - name: uninstall
        description: uninstall a plugin
      - name: enable
        description: enable a plugin
      - name: disable
        description: disable a plugin
      - name: validate
        description: validate a plugin
        completion:
          positional:
            - ["$files", "$directories"]
      - name: link
        description: generate link to a marketplace
      - name: help
        description: show help
  - name: remote-control
    description: manage the remote-control background daemon
    commands:
      - name: start
        description: register and start the remote-control daemon
        flags:
          --name=: set this machine's instance name shown in Remote Control
          --session: register login-scoped daemon instead of starting at boot
          -h, --help: show help
      - name: status
        description: show the daemon's status
        flags:
          -h, --help: show help
      - name: stop
        description: stop the daemon and unregister it
        flags:
          -h, --help: show help
  - name: update
    description: update CLI
