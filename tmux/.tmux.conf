bind-key -r f copy-mode \; send-keys '?'

bind-key -r t run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
bind-key -r e run-shell "tmux neww 'SESSIONIZER_DIR=~ ~/.local/scripts/tmux-sessionizer'"
