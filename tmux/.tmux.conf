unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

set -g mouse on
set -g default-terminal "screen-256color"
set -s escape-time 0

set -g base-index 1
set -g pane-base-index 1
set -g status-position bottom
set -g status-fg colour137
set -g status-bg '#333333'
set -wg mode-style bg='#8B8B8B'
# set -g status-bg '#4d3f83'
set -g status-left '#[fg=colour42,bold] [#{session_name}] '
set -g status-right '#[fg=colour15, bg=colour141,bold] %d/%m/%y #[fg=colour15,bg=colour69] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 40
set-option -g history-limit 5000

# Killing the session you're ATTACHED to must not throw you out of tmux while other
# sessions are still alive. Default `on` detaches the client the instant its session is
# destroyed — so ⌘J → Ctrl-x on your own row (or `+w → x, or a maw group kill) dropped you
# to the bare terminal even with other sessions left. `off` = tmux switches the client to
# the most recently active REMAINING session instead, and only when the last session dies
# does the server exit and drop you out of tmux. Native option: no wrapper script needed.
# Verified on tmux 3.6 against a throwaway `-L kst` server with a real attached client:
# (1) 3 sessions, Ctrl-x on the attached one → client moves to a remaining session, and the
#     ⌘J display-popup and its fzf SURVIVE the switch (the list reloads, dead row gone);
# (2) last session, same keystroke → server exits, client exits rc=0, outer tty left sane
#     (icanon+echo on) — fzf dying with the popup does not corrupt the terminal.
# Other values (tmux(1) detach-on-destroy): `next`/`previous` = alphabetical neighbour
# instead of most-recently-active; `no-detached` = switch only if a detached session exists.
# Side effect worth knowing: `exit` in a session's last pane now also hops you to another
# session instead of leaving tmux.
set -g detach-on-destroy off

setw -g mode-keys vi

setw -g message-style "fg=white,bg=blue,bold"

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-current-style bg='#1E1E1E'
# Priority: @cc_wait (❓, yellow) = pane is waiting on you (AskUserQuestion / permission) >
# @cc_processing (magenta, colour13, COLOUR ONLY no icon) = Claude is actively working
# (set on UserPromptSubmit, cleared on Stop) > @cc_done (🤖, green) = work finished.
# Checked wait-first so an unanswered prompt never hides behind a stale done/processing flag.
# NOTE: @cc_processing is deliberately NOT in the enter-clear hooks below — it reflects a LIVE
# state, so viewing the window mustn't erase it while work is still running (unlike the
# wait/done notification flags, which clear on view = "acknowledged").
setw -g window-status-current-format ' #[fg=colour137,bold]#I:#{?@cc_wait,#[fg=colour220#,bold]#W#{@cc_wait},#{?@cc_processing,#[fg=colour13#,bold]#W,#{?@cc_done,#[fg=colour46#,bold]#W#{@cc_done},#[fg=colour15#,bold]#W}}}#[fg=colour15,bold]#F '
setw -g window-status-format ' #[fg=colour250,bold]#I:#{?@cc_wait,#[fg=colour220#,bold]#W#{@cc_wait},#{?@cc_processing,#[fg=colour13#,bold]#W,#{?@cc_done,#[fg=colour46#,bold]#W#{@cc_done},#[fg=colour250#,bold]#W}}}#[fg=colour250,bold]#F '
# Clear Claude NOTIFICATION flags (@cc_done set by Stop hook; @cc_wait by permission) when
# entering the window. @cc_processing is intentionally excluded (see NOTE above).
set-hook -g after-select-window 'set-option -w -u @cc_done'
set-hook -ga after-select-window 'set-option -w -u @cc_wait'
# ...also when entering via session switch (choose-session / mouse) or attach — those don't run select-window
set-hook -g client-session-changed 'set-option -w -u @cc_done'
set-hook -ga client-session-changed 'set-option -w -u @cc_wait'
set-hook -g client-attached 'set-option -w -u @cc_done'
set-hook -ga client-attached 'set-option -w -u @cc_wait'

set-window-option -g window-active-style bg=terminal
# set-window-option -g window-style        bg=terminal
set-window-option -g window-style        bg=color235

set -g pane-border-indicators off
# Pane border: top status line
set -g pane-border-status top
set -g pane-border-format "#{?pane_active, #[fg=colour14]#P: #[fg=colour14#,bold]#{s/^[0-9][0-9.]*$/claude/:pane_current_command}#[default#,fg=colour2] #{b:pane_current_path} , #[fg=colour238]#P: #{s/^[0-9][0-9.]*$/claude/:pane_current_command} #{b:pane_current_path} }"
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour111'
set -g pane-border-lines heavy

set-option -g history-limit 5000

# Configure tmux-prefix-highlight colors
set -g @prefix_highlight_output_prefix '['
set -g @prefix_highlight_output_suffix ']'

# bind -r h select-pane -L
# bind -r j select-pane -D
# bind -r k select-pane -U
# bind -r l select-pane -R

bind -n -r C-h select-pane -L
bind -n -r C-j select-pane -D
bind -n -r C-k select-pane -U
bind -n -r C-l select-pane -R

bind-key v split-window -h
bind-key s split-window -v

# bind -r J resize-pane -D 5
# bind -r K resize-pane -U 5
# bind -r H resize-pane -L 5
# bind -r L resize-pane -R 5

bind -n -r M-j resize-pane -D 5
bind -n -r M-k resize-pane -U 5
bind -n -r M-h resize-pane -L 5
bind -n -r M-l resize-pane -R 5

# `+w
# select session to kill press x
bind W choose-session
bind -T choose-mode x run "tmux kill-session -t '%%'"

# `+w → searchable tree, sessions collapsed by default (-s). Press / to search, Enter/→ to expand.
bind w choose-tree -Zs

# `+j → fuzzy-jump to any live pane (tmux-switch: fzf over tmux list-panes, preview =
# the pane's screen). Pure tmux, no maw. `j` is unbound in tmux's default prefix table.
bind j display-popup -E -w 98% -h 95% -T " ⌘J · fleet switch " "~/.local/scripts/tmux-switch"

# `+k → fzf-pick a saved maw group and restore it (reopens closed Claude sessions via
# claude --resume; ctrl-x kills a group's live sessions, ctrl-d deletes a saved group).
# Runs in a popup so it doesn't disturb the active pane; absolute path since a popup's
# default-shell may not source .zshrc. WezTerm ⌘R forwards prefix+k here (NOT prefix+r —
# that's reload-config; see keys.lua). `k` is unbound in tmux's default prefix table.
# Path is the engine-neutral tier (~/.agent-shared/bin), NOT ~/.claude/bin: maw serves both
# Claude and Codex panes, and the ~/.claude/bin copy was removed in the de-symlink of
# 2026-08-09 — this line kept pointing at it, so ⌘R opened a popup that died instantly.
bind k display-popup -E -w 70% -h 60% -T " ⌘R · restore group " "~/.agent-shared/bin/maw restore --pick"

# `+g → lazygit in a popup for the CURRENT pane's repo. `-d #{pane_current_path}` is
# required: a popup otherwise opens in the server's startup dir, not the active pane.
# WezTerm ⌘G forwards prefix+g here (see keys.lua). `g` is unbound in tmux's default prefix table.
bind g display-popup -E -w 95% -h 90% -d "#{pane_current_path}" -T " ⌘G · lazygit " "lazygit"

# `+C-e → open the editor at the CURRENT pane's path (zsh alias `c`, currently `zed .`).
# run-shell, NOT display-popup like `bind g`: the editor is a GUI app, so there's no TUI to
# host — a popup would flash and close. `-b` backgrounds it so the server never blocks.
# Invokes the ALIAS, not `zed` directly: .aliases.zsh is where the editor choice lives
# (surf → agy → zed over time), so ⌘E follows a future swap for free. `eval c` is required —
# `zsh -c 'source …; c'` parses the whole string before the alias is defined, so `c` stays a
# command name and fails. NB internal key is C-e, NOT e: `bind e` is send-prefix (line 4, the
# literal-backtick hatch). WezTerm ⌘E forwards prefix+C-e here (see keys.lua). C-e is unbound
# in tmux's default prefix table.
bind C-e run-shell -b "cd '#{pane_current_path}' && zsh -c 'source ~/.dotfiles/terminal/zsh/.aliases.zsh && eval c'"

bind -n -r "M-{" swap-window -t -1\; select-window -t -1
bind -n -r "M-}" swap-window -t +1\; select-window -t +1
bind-key "}" run-shell 'cur=$(tmux display -p "#I"); tmux move-window -t 9999; tmux move-window -r; tmux select-window -t :$cur'

bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded..."

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Y = copy FLATTENED to a single line: rejoins a command that soft-wrapped in a narrow
# pane (removes the wrap newline + any stray `\`), so pasting `claude --resume <uuid>` &
# friends doesn't break mid-command. Keeps `y` byte-exact for multi-line copies.
# Logic lives in ~/.local/scripts/trim-copy — keeping the regex out of this double-quoted
# string avoids tmux's config parser eating the \n \A \z backslashes.
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "~/.local/scripts/trim-copy | pbcopy"

# `-and-cancel` (tmux's own default for this key) is REQUIRED, not cosmetic: bare copy-pipe
# copies but LEAVES the pane in copy-mode with no visual cue, so the next thing typed or
# pasted is read as vi keys — a `:` then opens the "(goto line)" prompt and swallows the
# rest of the line. Worse with two clients on one session: the mode is per-PANE, so a drag
# in one window silently arms the trap in the other. Diagnosed 2026-08-09 (3rd recurrence).
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Triple-click line-copy strips the trailing newline tmux's `select-line` always appends.
# Same fix as `Y` above: pipe through trim-copy before pbcopy instead of tmux's default
# bare copy-pipe-and-cancel (which copies the raw line + its \n terminator as-is).
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "~/.local/scripts/trim-copy | pbcopy" }
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "~/.local/scripts/trim-copy | pbcopy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "~/.local/scripts/trim-copy | pbcopy"

# set -s extended-keys on
# set -as terminal-features 'xterm*:extkeys'
# shift+enter
bind-key -n S-Enter send-keys Escape "[13;2u"

# `+y → copy "<seq>:<window-name>" to clipboard (same #I:#W pairing as the status-bar
# window format above). Internal key is `y` (yank mnemonic), NOT `o` — plain `o`/`C-o`/
# `M-o` are tmux defaults (pane cycle / window rotate), same "Mac accelerator needn't
# match internal key" trick as ⌘R → prefix+k. WezTerm ⌘O forwards prefix+y here (see
# keys.lua). Unlike session_id, window_index has no `$` prefix to strip. Wrapped in
# `printf "%s" "$(...)"`, NOT piped straight to pbcopy: `display-message -p` always
# appends a trailing newline, which pbcopy would faithfully copy along with it —
# command substitution strips that trailing newline before printf re-emits it clean.
bind-key y run-shell -b 'printf "%s" "$(tmux display-message -p "#{window_index}:#{window_name}")" | pbcopy'
